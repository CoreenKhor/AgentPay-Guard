name: CI & Quality Gate

on:
  push:
    branches:
      - main
      - coreen
      - jish
      - vera
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Typescript Strict Typecheck & Lint
  # ---------------------------------------------------------------------------
  typescript-checks:
    name: TypeScript Strict Typecheck & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Root Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      - name: Verify TypeScript Compilation
        run: |
          if [ -f tsconfig.json ]; then
            npx tsc --noEmit
          fi

      - name: Typecheck Packages
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "===> Checking $dir <==="
              (cd "$dir" && npm ci --ignore-scripts 2>/dev/null || npm install)
              if grep -q '"build"' "$dir/package.json"; then (cd "$dir" && npm run build); fi
              if grep -q '"test"' "$dir/package.json"; then (cd "$dir" && npm test); fi
            fi
          done

  # ---------------------------------------------------------------------------
  # 2. Rust & Anchor Smart Contract Checks
  # ---------------------------------------------------------------------------
  rust-contract-checks:
    name: Rust & Anchor Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Check Rust Program Status
        run: |
          if [ -f "programs/agentpay-guard/Cargo.toml" ]; then
            echo "Rust program detected. Running toolchain checks..."
            cargo fmt --manifest-path programs/agentpay-guard/Cargo.toml -- --check || true
            cargo clippy --manifest-path programs/agentpay-guard/Cargo.toml --all-targets -- -D warnings || true
            cargo test --manifest-path programs/agentpay-guard/Cargo.toml || true
          else
            echo "programs/agentpay-guard/Cargo.toml not present yet. Skipping Rust checks."
          fi

  # ---------------------------------------------------------------------------
  # 3. Adversarial Security Attack Suite Validation
  # ---------------------------------------------------------------------------
  adversarial-security-tests:
    name: Adversarial Attack Suite Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Adversarial Test Suite
        run: |
          if [ -f tests/adversarial/package.json ]; then
            cd tests/adversarial
            npm ci || npm install
            npm test
          else
            echo "Adversarial test suite configured; ready for test definitions."
          fi
