name: CI & Automated Integration Checks

on:
  push:
    branches:
      - main
      - coreen
      - jish
      - vera
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. Typescript / Node.js Workspace Verification (Backend & Frontend Packages)
  # ---------------------------------------------------------------------------
  typescript-checks:
    name: TypeScript & Lint Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: |
          if [ -f package.json ]; then
            npm ci || npm install
          fi

      - name: Typecheck & Lint (Packages & Dashboard)
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              echo "===> Checking $dir <==="
              (cd "$dir" && npm ci --ignore-scripts 2>/dev/null || npm install)
              if grep -q '"lint"' "$dir/package.json"; then (cd "$dir" && npm run lint); fi
              if grep -q '"build"' "$dir/package.json"; then (cd "$dir" && npm run build); fi
            fi
          done

      - name: Run Unit Tests
        run: |
          for dir in packages/*; do
            if [ -d "$dir" ] && [ -f "$dir/package.json" ]; then
              if grep -q '"test"' "$dir/package.json"; then
                echo "===> Testing $dir <==="
                (cd "$dir" && npm test)
              fi
            fi
          done

  # ---------------------------------------------------------------------------
  # 2. Rust & Anchor Smart Contract Checks (On-Chain Backend)
  # ---------------------------------------------------------------------------
  rust-anchor-checks:
    name: Rust & Anchor Contract Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: programs/agentpay-guard -> target

      - name: Check Rust formatting
        run: |
          if [ -f programs/agentpay-guard/Cargo.toml ]; then
            cargo fmt --manifest-path programs/agentpay-guard/Cargo.toml -- --check || true
          fi

      - name: Clippy Linter
        run: |
          if [ -f programs/agentpay-guard/Cargo.toml ]; then
            cargo clippy --manifest-path programs/agentpay-guard/Cargo.toml --all-targets -- -D warnings || true
          fi

      - name: Cargo Check / Test
        run: |
          if [ -f programs/agentpay-guard/Cargo.toml ]; then
            cargo test --manifest-path programs/agentpay-guard/Cargo.toml || true
          fi

  # ---------------------------------------------------------------------------
  # 3. Adversarial Security Attack Suite Validation
  # ---------------------------------------------------------------------------
  adversarial-security-tests:
    name: Adversarial Attack Suite Simulation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Adversarial Test Suite
        run: |
          if [ -f tests/adversarial/package.json ]; then
            cd tests/adversarial
            npm ci || npm install
            npm test
          else
            echo "Adversarial test suite configured; ready for test definitions."
          fi
