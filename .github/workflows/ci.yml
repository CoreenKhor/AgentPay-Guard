name: CI & Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONS_RUNNER_FORCE_ACTIONS_NODE_VERSION: "node24"

jobs:
  # ---------------------------------------------------------------------------
  # 1. TypeScript Strict Typecheck & Problem Detection
  # ---------------------------------------------------------------------------
  typescript-checks:
    name: TypeScript Strict Typecheck & Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 (LTS)
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify TypeScript Compilation (Zero Errors)
        run: npx tsc --noEmit

      - name: Run Integrity Checks
        run: npm test

  # ---------------------------------------------------------------------------
  # 2. Rust & Anchor Smart Contract Checks (Conditional on Cargo.toml)
  # ---------------------------------------------------------------------------
  rust-contract-checks:
    name: Rust & Anchor Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Rust Program Status
        run: |
          if [ -f "programs/agentpay-guard/Cargo.toml" ]; then
            echo "Rust program detected. Running toolchain setup..."
          else
            echo "programs/agentpay-guard/Cargo.toml not present yet. Skipping Rust checks."
          fi
