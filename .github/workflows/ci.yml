name: CI & Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # 1. TypeScript Strict Typecheck & Problem Detection
  # ---------------------------------------------------------------------------
  typescript-typecheck:
    name: TypeScript Strict Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Verify TypeScript Compilation (Zero Errors)
        run: npx tsc --noEmit

  # ---------------------------------------------------------------------------
  # 2. Automated Test Suite (PayBind, Sentinel, SDK, Adversarial Suite)
  # ---------------------------------------------------------------------------
  automated-tests:
    name: Unit & Adversarial Test Suite
    runs-on: ubuntu-latest
    needs: [typescript-typecheck]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run PayBind Core Tests
        run: npm run test:paybind

      - name: Run Anomaly Sentinel Tests
        run: npm run test:sentinel

      - name: Run Agent SDK Interceptor Tests
        run: npm run test:sdk

      - name: Run Red-Team Adversarial Test Suite
        run: npm run test:adversarial

  # ---------------------------------------------------------------------------
  # 3. Rust & Anchor Smart Contract Checks (Conditional on Cargo.toml)
  # ---------------------------------------------------------------------------
  rust-contract-checks:
    name: Rust & Anchor Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Rust Program Status
        run: |
          if [ -f "programs/agentpay-guard/Cargo.toml" ]; then
            echo "Rust program detected. Running toolchain setup..."
          else
            echo "programs/agentpay-guard/Cargo.toml not present yet. Skipping Rust checks."
          fi
