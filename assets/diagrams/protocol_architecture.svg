<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #0d1117; }
      .container { fill: #161b22; stroke: #30363d; stroke-width: 1.5; rx: 12px; }
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 600; fill: #8b949e; letter-spacing: 0.5px; text-transform: uppercase; }
      .card-agent { fill: #1c2333; stroke: #388bfd; stroke-width: 1.5; rx: 8px; }
      .card-kernel { fill: #211c38; stroke: #a371f7; stroke-width: 1.5; rx: 8px; }
      .card-solana { fill: #122824; stroke: #2ea043; stroke-width: 1.5; rx: 8px; }
      .card-alert { fill: #2c1a1d; stroke: #f85149; stroke-width: 1.5; rx: 8px; }
      .card-hitl { fill: #2e2213; stroke: #d29922; stroke-width: 1.5; rx: 8px; }
      .node-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 14px; font-weight: 700; fill: #f0f6fc; }
      .node-sub { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; fill: #8b949e; }
      .edge { stroke: #58a6ff; stroke-width: 2; fill: none; }
      .edge-purple { stroke: #bc8cff; stroke-width: 2; fill: none; }
      .edge-green { stroke: #3fb950; stroke-width: 2; fill: none; }
      .edge-alert { stroke: #f85149; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .edge-hitl { stroke: #d29922; stroke-width: 1.5; stroke-dasharray: 4,4; fill: none; }
      .label-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 11px; font-weight: 500; fill: #79c0ff; }
      .label-alert { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #ff7b72; }
      .label-hitl { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; font-size: 10px; fill: #e3b341; }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#58a6ff" />
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#bc8cff" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#3fb950" />
    </marker>
    <marker id="arrow-alert" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#f85149" />
    </marker>
    <marker id="arrow-hitl" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#d29922" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="620" class="bg" rx="14" />

  <!-- Container 1: Agent Execution Environment -->
  <rect x="30" y="30" width="940" height="110" class="container" />
  <text x="50" y="55" class="title">1. Agent Execution Environment (Host Runtime)</text>
  
  <rect x="50" y="68" width="380" height="56" class="card-agent" />
  <text x="70" y="93" class="node-title">Autonomous AI Agent</text>
  <text x="70" y="110" class="node-sub">Inference Loop (LangChain / ElizaOS / Solana Agent Kit)</text>

  <rect x="570" y="68" width="380" height="56" class="card-agent" />
  <text x="590" y="93" class="node-title">Proposed Service Action</text>
  <text x="590" y="110" class="node-sub">Tool Call: Query Data / Compute Service with Micropayment</text>

  <!-- Path Agent -> Proposed Action -->
  <path d="M 430 96 L 560 96" class="edge" marker-end="url(#arrow)" />
  <text x="455" y="88" class="label-text">Invokes Tool</text>

  <!-- Container 2: AgentPay Guard Runtime Kernel -->
  <rect x="30" y="160" width="940" height="250" class="container" />
  <text x="50" y="185" class="title">2. AgentPay Guard Runtime Kernel (Inline Security Verification)</text>

  <!-- Layer 1 -->
  <rect x="50" y="205" width="270" height="64" class="card-kernel" />
  <text x="68" y="231" class="node-title">Layer 1: PayBind Engine</text>
  <text x="68" y="250" class="node-sub">Cryptographic Intent Binding (Payload Digest)</text>

  <!-- Layer 2 -->
  <rect x="365" y="205" width="270" height="64" class="card-kernel" />
  <text x="383" y="231" class="node-title">Layer 2: Anomaly Sentinel</text>
  <text x="383" y="250" class="node-sub">Velocity Heuristics &amp; Loop Detectors</text>

  <!-- Layer 3 -->
  <rect x="680" y="205" width="270" height="64" class="card-kernel" />
  <text x="698" y="231" class="node-title">Layer 3: Spending Policies</text>
  <text x="698" y="250" class="node-sub">Dynamic Ceilings &amp; Whitelist Engine</text>

  <!-- Out-of-band / Rejection nodes -->
  <rect x="50" y="325" width="270" height="52" class="card-alert" />
  <text x="68" y="347" class="node-title" fill="#ff7b72">Reject: Hash Mismatch</text>
  <text x="68" y="364" class="node-sub">Payload Substitution / Stale Receipt</text>

  <rect x="365" y="325" width="270" height="52" class="card-alert" />
  <text x="383" y="347" class="node-title" fill="#ff7b72">Trigger: Circuit Breaker</text>
  <text x="383" y="364" class="node-sub">Emergency Freeze on Recursive Loops</text>

  <rect x="680" y="325" width="270" height="52" class="card-hitl" />
  <text x="698" y="347" class="node-title" fill="#e3b341">Escalate: HITL Gateway</text>
  <text x="698" y="364" class="node-sub">Human Review for High-Value Anomalies</text>

  <!-- Connections in Kernel -->
  <!-- Intercept down to L1 -->
  <path d="M 760 124 L 760 145 L 185 145 L 185 195" class="edge-purple" marker-end="url(#arrow-purple)" />
  <text x="400" y="140" class="label-text" fill="#bc8cff">Intercepts Transaction Proposal Before Signing</text>

  <!-- L1 -> L2 -->
  <path d="M 320 237 L 355 237" class="edge-purple" marker-end="url(#arrow-purple)" />

  <!-- L2 -> L3 -->
  <path d="M 635 237 L 670 237" class="edge-purple" marker-end="url(#arrow-purple)" />

  <!-- Rejections / Circuit Breakers -->
  <path d="M 185 269 L 185 315" class="edge-alert" marker-end="url(#arrow-alert)" />
  <text x="195" y="295" class="label-alert">Invalid Digest</text>

  <path d="M 500 269 L 500 315" class="edge-alert" marker-end="url(#arrow-alert)" />
  <text x="510" y="295" class="label-alert">Frequency Spike</text>

  <path d="M 815 269 L 815 315" class="edge-hitl" marker-end="url(#arrow-hitl)" />
  <text x="825" y="295" class="label-hitl">&gt; Threshold</text>

  <!-- Container 3: Solana Ledger Layer -->
  <rect x="30" y="430" width="940" height="160" class="container" />
  <text x="50" y="455" class="title">3. Solana Ledger Layer (On-Chain Settlement &amp; Metadata)</text>

  <rect x="50" y="475" width="270" height="66" class="card-solana" />
  <text x="68" y="501" class="node-title">Agent Vault PDA</text>
  <text x="68" y="520" class="node-sub">Non-Custodial Program Treasury</text>

  <rect x="365" y="475" width="270" height="66" class="card-solana" />
  <text x="383" y="501" class="node-title">Layer 4: Financial Hub</text>
  <text x="383" y="520" class="node-sub">Anchor Program (400ms Finality)</text>

  <rect x="680" y="475" width="270" height="66" class="card-solana" />
  <text x="698" y="501" class="node-title">Verified Provider &amp; Audit Log</text>
  <text x="698" y="520" class="node-sub">Atomic Micropayment &amp; Metadata Receipt</text>

  <!-- Down to Solana Layer -->
  <path d="M 815 269 L 815 415 L 500 415 L 500 465" class="edge-green" marker-end="url(#arrow-green)" />
  <text x="575" y="423" class="label-text" fill="#3fb950">Approved Intent Authorization Ticket</text>

  <!-- Internal Solana Flow -->
  <path d="M 320 508 L 355 508" class="edge-green" marker-end="url(#arrow-green)" />
  <path d="M 635 508 L 670 508" class="edge-green" marker-end="url(#arrow-green)" />
</svg>
